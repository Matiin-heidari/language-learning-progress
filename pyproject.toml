[project]
name = "sprachweg"
version = "0.1.0"
description = "Personal language-learning hours tracker (German A1 -> C1, multi-language ready)"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0",
    "flask-sqlalchemy>=3.1",
    "flask-migrate>=4.0",
    "flask-wtf>=1.2",
    "python-dotenv>=1.0",
    "waitress>=3.0",
    "flask-login>=0.6.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "time-machine>=2.14",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sprachweg"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
