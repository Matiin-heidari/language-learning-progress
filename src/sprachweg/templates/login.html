{% from "macros/forms.html" import csrf_input %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Sprachweg</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body style="display:flex; align-items:center; justify-content:center; min-height:100vh;">
  <div class="card" style="width:100%; max-width:360px;">
    <a href="{{ url_for('main.landing') }}" class="brand mt-8" style="justify-content:center; margin-bottom:16px; text-decoration:none; color:inherit;">
      <span class="brand-mark">🇩🇪</span><span>Sprachweg</span>
    </a>
    {% if error %}<p style="color:var(--critical); text-align:center; font-size:14px;">{{ error }}</p>{% endif %}
    <form method="post">
      {{ csrf_input() }}
      <div class="field">
        <label>Username or email</label>
        <input type="text" name="username" autofocus required autocapitalize="off">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" name="password" required>
      </div>
      <button type="submit" class="btn btn-primary w-full">Sign in</button>
    </form>
    <p class="text-muted mt-16" style="text-align:center; font-size:13px;">
      New here? <a href="{{ url_for('auth.signup') }}">Create an account</a>
    </p>
  </div>
</body>
</html>
