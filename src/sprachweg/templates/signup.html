{% from "macros/forms.html" import csrf_input %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create an account · Sprachweg</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body style="display:flex; align-items:center; justify-content:center; min-height:100vh; padding:16px;">
  <div class="card" style="width:100%; max-width:400px;">
    <a href="{{ url_for('main.landing') }}" class="brand mt-8" style="justify-content:center; margin-bottom:16px; text-decoration:none; color:inherit;">
      <span class="brand-mark">🇩🇪</span><span>Sprachweg</span>
    </a>
    {% if error %}<p style="color:var(--critical); text-align:center; font-size:14px;">{{ error }}</p>{% endif %}
    <form method="post">
      {{ csrf_input() }}
      <div class="field">
        <label>Username</label>
        <input type="text" name="username" value="{{ username }}" placeholder="lowercase, no spaces" pattern="[a-z0-9_]{3,20}" required autocapitalize="off" autofocus>
      </div>
      <div class="field">
        <label>Display name (optional)</label>
        <input type="text" name="display_name" value="{{ display_name }}" placeholder="How others see you">
      </div>
      <div class="field">
        <label>Email (optional)</label>
        <input type="email" name="email" value="{{ email }}">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" name="password" minlength="8" required>
      </div>
      <div class="field">
        <label>Confirm password</label>
        <input type="password" name="confirm_password" minlength="8" required>
      </div>
      <button type="submit" class="btn btn-primary w-full">Create account</button>
    </form>
    <p class="text-muted mt-16" style="text-align:center; font-size:13px;">
      Already have an account? <a href="{{ url_for('auth.login') }}">Sign in</a>
    </p>
  </div>
</body>
</html>
